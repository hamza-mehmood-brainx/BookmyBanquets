# API redirects (must come before catch-all)
[[redirects]]
  from = "/api/*"
  to = "http://13.53.187.108:3000/api/:splat"
  status = 200
  force = true

# Socket.IO redirect (must come before catch-all)
[[redirects]]
  from = "/socket.io/*"
  to = "http://13.53.187.108:3000/socket.io/:splat"
  status = 200
  force = true

# Static file uploads redirect (must come before catch-all)
[[redirects]]
  from = "/uploads/*"
  to = "http://13.53.187.108:3000/uploads/:splat"
  status = 200
  force = true

# Catch-all redirect for React Router (must come LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200